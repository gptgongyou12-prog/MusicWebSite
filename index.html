<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #e2e2f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #7c6aff, #c084fc);
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 32px rgba(124,106,255,.4);
    }
    .icon svg { width: 36px; height: 36px; fill: white; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .sub { color: #6b6b8a; font-size: .88rem; margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #7c6aff, #c084fc);
      color: white; font-size: .95rem; font-weight: 600;
      border: none; border-radius: 14px; cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(124,106,255,.35);
      transition: opacity .15s, transform .15s;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .btn svg { width: 18px; height: 18px; fill: white; }
    .version { color: #6b6b8a; font-size: .75rem; margin-top: 12px; }
    .steps {
      text-align: left; margin-top: 24px;
      border-top: 1px solid #1e1e2e; padding-top: 20px;
    }
    .step { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
    .num {
      width: 22px; height: 22px; min-width: 22px;
      background: rgba(124,106,255,.15); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; color: #c084fc;
    }
    .step p { font-size: .83rem; color: #9090b0; line-height: 1.4; padding-top: 2px; }
    .step p strong { color: #e2e2f0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <h1>Music App</h1>
    <p class="sub">원하는 음악 사이트를 앱처럼.<br>브라우저 없이, 광고 없이.</p>

    <a class="btn" href="https://github.com/gptgongyou12-prog/MusicWebApp/releases/latest/download/app-release.apk" id="dl-btn">
      <svg viewBox="0 0 24 24"><path d="M12 16l-5-5 1.41-1.41L11 13.17V4h2v9.17l2.59-2.58L17 11l-5 5zm-7 4v-2h14v2H5z"/></svg>
      APK 다운로드
    </a>
    <p class="version" id="ver"></p>

    <div class="steps">
      <div class="step"><div class="num">1</div><p>APK 다운로드 후 <strong>파일 앱</strong>에서 열기</p></div>
      <div class="step"><div class="num">2</div><p>설정 → <strong>알 수 없는 앱 설치</strong> 허용</p></div>
      <div class="step"><div class="num">3</div><p>앱 실행 → <strong>URL · 이름 · 아이콘</strong> 설정</p></div>
    </div>
  </div>

  <script>
    // 버전 표시만 API로 (실패해도 다운로드는 정상 작동)
    fetch('https://api.github.com/repos/gptgongyou12-prog/MusicWebApp/releases/latest')
      .then(r => r.json())
      .then(data => { document.getElementById('ver').textContent = data.tag_name ?? ''; })
      .catch(() => {});
  </script>
</body>
</html>
